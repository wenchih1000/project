<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Working with Flask and SocketIO</title>
  <style>

      border: 1px solid black;
      border-collapse: collapse;

<!-- https://cdnjs.cloudflare.com/ajax/libs/socket.io/1.4.5/ -->
<!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.0/socket.io.js"></script> -->

<script src="{{url_for('static', filename='socket.io.js')}}"></script>
<script src="{{url_for('static', filename='jquery.js')}}"></script>
<script>
  // var socket = io()
  var socket = io('http://127.0.0.1/update');
  var sid = '';

  // client-side
  socket.on("connect", () => {
    data = {"connect":{"new": socket.id, "old":sid}}
    // socket.emit('message', data);
    sio = socket.id
    console.log("connect:" + JSON.stringify(data));
    // var formData = sessionStorage.getItem('data');
    // console.log("formData:"+JSON.parse(formData));
  });
  socket.on("disconnect", () => {
    data = {"disconnect":{"new": socket.id, "old":sid}}
    // socket.emit('message', data);
    console.log("disconnect:" + JSON.stringify(data));
  });

  $(document).ready(function() {
    $("#pass").click(function() {
      data = {"player":$('#seat').text(), "action":"pass", "tiles":[]}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
    $("#chow").click(function() {
      data = {"player":$('#seat').text(), "action":"chow", "tiles":[]}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
    $("#pong").click(function() {
      data = {"player":$('#seat').text(), "action":"pong", "tiles":[]}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
    $("#kong").click(function() {
      data = {"player":$('#seat').text(), "action":"kong", "tiles":[]}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
    $("#hu").click(function() {
      data = {"player":$('#seat').text(), "action":"hu", "tiles":[]}
      socket.emit('message', data);
      console.log(data);
      return false;
    });

    $("#drawing").click(function() {
      data = {"player":$('#seat').text(), "action":"drawing", "tiles":[]}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
    $("#discard").click(function() {
      data = {"player":$('#seat').text(), "action":"discard", "tiles":[]}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
    $("#dice").click(function() {
      data = {"player":$('#seat').text(), "action":"dice", "tiles":[]}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
  });

  // received from web server
  socket.on('message', function(msg){
      console.log("message");

      for (const key in msg.data)
      {
        switch(key)
        {
          case 'info':
            $('#name').text(msg.data["info"]["name"]);
            $('#avatar').text(msg.data["info"]["avatar"]);
            $('#seat').text(msg.data["info"]["seat"]);
            break;
          case 'join_game':
            $('#wait').text(msg.data["join_game"]["wait_num"]);
            break;
          case 'game_state':
            // {'game_state': {'round_wind': 'east', 'dealer_wind': 'east', 'current_player': 'east', 'dealer_num': 0, 'dice_score': [2, 6, 3]}}
            $('#dice_score').text(msg.data["game_state"]["dice_score"].join(", "));
            break;
          case 'player_seat':
            // "player_seat":{
            //     "east":"name 1","south":"name 2","west":"name 3","north":"name 4"
            // }
            for (const key in msg.data['player_seat'])
            {
              if (msg.data['player_seat'][key] == $('#name').text())
              {
                $('#seat').text(key);
                break;
              }
            }
            break;
          case 'action_state':
            break;
          case 'hand_tiles':
            hand = msg.data['hand_tiles'][0]['hand']
            for (const key in hand)
            {
              $("#Tiles tr:eq(0) td:eq("+key+")").text(hand[key]);
            }
            drawed = msg.data['hand_tiles'][0]['drawed']
            $("#Tiles tr:eq(0) td:eq(16)").text(drawed);
            break;
          default:
            break;
        }
      }
      // show log
      console.log(JSON.stringify(msg.data));
  });
</script>

<body>
  等待人數:<label id="wait"></label><br>
  玩家名稱:<label id="name"></label><br>
  玩家頭像:<label id="avatar"></label><br>
  座位:<label id="seat"></label><br>
  骰子:<label id="dice_score"></label><br>

  <table id="Tiles">
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
  </table>

  <button id="hu">胡</button>
  <button id="kong">槓</button>
  <button id="pong">碰</button>
  <button id="chow">吃</button>
  <button id="pass">過</button><br>

  <button id="drawing">摸牌</button>
  <button id="discard">出牌</button>
  <button id="dice">擲骰子</button>
  <p id="message"></p>

<script>
  const table = document.getElementById("Tiles");
  const messageElement = document.getElementById("message");

  // Get all table cells (td elements)
  const cells = table.querySelectorAll("td");

  // Iterate over each cell and attach a click event listener
  cells.forEach(cell => {
    cell.addEventListener("click", function() {
      // 'this' refers to the clicked cell
      const cellContent = this.textContent;
      // const rowIndex = this.closest('tr').rowIndex; // Get row index
      // const cellIndex = this.cellIndex; // Get cell index within the row
      if(messageElement.textContent == "")
        messageElement.textContent += cellContent;
      else
        messageElement.textContent += "," + cellContent;
      
    });
  });
</script>
</body>

</html>
