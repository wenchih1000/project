<script>
  // var socket = io()
  var socket = io('http://127.0.0.1/update');
  var sid = '';

  // client-side
  socket.on("connect", () => {
    data = {"connect":{"new": socket.id, "old":sid}}
    // socket.emit('message', data);
    sio = socket.id
    console.log("connect:" + JSON.stringify(data));
    // var formData = sessionStorage.getItem('data');
    // console.log("formData:"+JSON.parse(formData));
  });
  socket.on("disconnect", () => {
    data = {"disconnect":{"new": socket.id, "old":sid}}
    // socket.emit('message', data);
    console.log("disconnect:" + JSON.stringify(data));
  });

  $(document).ready(function() {
    $("#pass").click(function() {
      data = {"action": "pass"}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
    $("#chow").click(function() {
      data = {"action": "chow"}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
    $("#pong").click(function() {
      data = {"action": "pong"}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
    $("#kong").click(function() {
      data = {"action": "kong"}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
    $("#hu").click(function() {
      data = {"action": "hu"}
      socket.emit('message', data);
      console.log(data);
      return false;
    });

    $("#drawing").click(function() {
      data = {"action": "drawing"}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
    $("#discard").click(function() {
      data = {"action": "discard"}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
    $("#dice").click(function() {
      data = {"action": "dice"}
      socket.emit('message', data);
      console.log(data);
      return false;
    });
  });

  // received from web server
  socket.on('message', function(msg){
      console.log("message");
      if('info' in msg.data)
      {
        $('#name').text(msg.data["info"]["name"]);
        $('#avatar').text(msg.data["info"]["avatar"]);
        // console.log(msg.data["info"]["name"] + ":" + msg.data["info"]["avatar"]);
        console.log(JSON.stringify(msg.data));
      }
      else if('join_game' in msg.data)
      {
        $('#wait').text(msg.data["join_game"]["wait_num"]);
        // console.log(msg.data["join_game"]);
        console.log(JSON.stringify(msg.data));
      }
      else if('player_seat' in msg.data)
      {
        console.log(JSON.stringify(msg.data));
      }
      else if('action_state' in msg.data)
      {
        // console.log(msg.data["action_state"]);
        console.log(JSON.stringify(msg.data));
      }
  });
</script>

<body>
  玩家名稱:<label id="name"></label><br>

  等待人數:<label id="wait"></label><br>

  <button id="hu">胡</button>
  <button id="kong">槓</button>
  <button id="pong">碰</button>
  <button id="chow">吃</button>

  <button id="drawing">摸牌</button>

</body>
