<!DOCTYPE html>
<html>
<head>
    <title>Flask 麻將遊戲</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>麻將遊戲</h1>
    <div id="mahjong-table">
    
        <div id="wall-top" class="wall-segment horizontal">
        </div>

        <div id="wall-bottom" class="wall-segment horizontal">
        </div>

        <div id="wall-left" class="wall-segment vertical">
        </div>

        <div id="wall-right" class="wall-segment vertical">
        </div>

        <div id="player-3" class="player-zone top-zone">
            <span class="score-display">玩家 1000</span>
            <div class="opponent-hand"></div> 
        </div>

        <div id="player-4" class="player-zone right-zone">
            <span class="score-display vertical-text">玩家 6000</span>
        </div>

        <div id="player-2" class="player-zone left-zone">
            <span class="score-display vertical-text">玩家 3000</span>
        </div>

        <div id="center-zone">
            <div id="river-container">
                <div id="discard-pile">
                    </div>
            </div>
            <div id="game-status-box">
                <span class="wind-indicator">北</span>
                <span class="remaining-tiles">剩餘張數: 55</span>
            </div>
        </div>

        <div id="player-1" class="player-zone bottom-zone">
            
            <div id="action-buttons">
                <button id="chow-btn">吃</button>
                <button id="pong-btn">碰</button>
                <button id="gang-btn">槓</button>
                <button id="hu-btn">胡</button>
                <button id="pass-btn">跳過</button>
                <button onclick="startGame()">開始遊戲</button>
            </div>
            
            <div id="ting-hint">聽牌提示: 3筒→混一色；白→對對胡</div>
            
            <div id="my-hand-area">
                <div class="melds-exposed"></div>
                <div id="my-active-hand">
                    </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
